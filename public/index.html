<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Покерный клуб</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-logo">
        <img src="logo.jpg" alt="PRIDE" onerror="this.style.display='none'">
        <h1>Pride</h1>
        <button id="profile-btn" class="profile-btn" title="Мой профиль">👤</button>
      </div>
      <nav class="tabs">
        <button class="tab active" data-tab="games">Игры</button>
        <button class="tab" data-tab="rating">Рейтинг</button>
        <button class="tab" data-tab="legends">Легенды</button>
      </nav>
    </header>

    <main>
      <!-- Вкладка: Игры -->
      <section id="tab-games" class="tab-content active">
        <div class="section-title">Предстоящие игры</div>
        <div id="games-list" class="list">
          <div class="loading">Загрузка...</div>
        </div>
        <div class="section-title" style="margin-top:16px">Прошедшие игры</div>
        <div id="past-games-list" class="list">
          <div class="loading">Загрузка...</div>
        </div>
        <button class="btn-all-games" id="btn-all-games">Все прошедшие игры →</button>
      </section>

      <!-- Экран всех прошедших игр -->
      <section id="screen-all-games" class="screen hidden">
        <button class="back-btn" id="all-games-back-btn">← Назад</button>
        <div class="section-title" style="margin-bottom:12px">Все игры</div>
        <div class="month-selector" style="margin-bottom:14px">
          <button class="ag-month-btn active" data-month="may">Май</button>
          <button class="ag-month-btn" data-month="april">Апрель</button>
          <button class="ag-month-btn" data-month="march">Март</button>
        </div>
        <div id="all-games-list" class="list">
          <div class="loading">Загрузка...</div>
        </div>
      </section>

      <!-- Вкладка: Легенды -->
      <section id="tab-legends" class="tab-content">
        <div class="legends-header">
          <div class="legends-crown">👑</div>
          <div class="legends-subtitle">Топ-15 по количеству побед за всё время</div>
        </div>
        <div id="legends-list" class="list">
          <div class="loading">Загрузка...</div>
        </div>
      </section>

      <!-- Экран статистики игрока -->
      <section id="screen-player" class="screen hidden">
        <button class="back-btn" id="player-back-btn">← Назад</button>
        <div class="profile-header" style="padding-top:0">
          <div class="profile-avatar" id="player-avatar"></div>
          <div class="profile-nickname" id="player-nickname"></div>
        </div>
        <div class="profile-stats" id="player-stats">
          <div class="loading">Загрузка...</div>
        </div>
        <div id="player-games" style="margin-top:16px"></div>
      </section>

      <!-- Экран профиля -->
      <section id="screen-profile" class="screen hidden">
        <div class="profile-header">
          <div class="profile-avatar" id="profile-avatar"></div>
          <div class="profile-nickname" id="profile-nickname"></div>
          <button class="profile-edit-btn" id="profile-edit-btn">✏️ Изменить ник</button>
        </div>
        <div class="profile-stats" id="profile-stats">
          <div class="loading">Загрузка...</div>
        </div>
      </section>

      <!-- Экран результатов игры -->
      <section id="screen-results" class="screen hidden">
        <button class="back-btn" id="back-btn">← Назад</button>
        <div id="results-title" class="section-title"></div>
        <div id="results-list" class="list"></div>
      </section>

      <!-- Вкладка: Рейтинг -->
      <section id="tab-rating" class="tab-content">
        <div class="month-selector">
          <button class="month-btn active" data-month="may">Май</button>
          <button class="month-btn" data-month="april">Апрель</button>
          <button class="month-btn" data-month="march">Март</button>
        </div>
        <div class="search-wrapper">
          <input id="rating-search" class="search-input" type="text" placeholder="🔍 Поиск по нику...">
        </div>
        <div id="rating-list" class="list">
          <div class="loading">Загрузка рейтинга...</div>
        </div>
      </section>
    </main>
  </div>

  <!-- Экран ввода ника -->
  <div id="screen-nickname" class="nickname-screen hidden">
    <div class="nickname-box">
      <div class="nickname-logo"><img src="logo.jpg" alt="PRIDE"></div>
      <h2 class="nickname-title">Добро пожаловать в<br><span>PRIDE</span></h2>
      <p class="nickname-hint">Введи свой ник в клубе, чтобы записываться на игры</p>
      <input id="nickname-input" class="nickname-input" type="text" placeholder="Твой ник" maxlength="30">
      <button id="nickname-btn" class="btn btn-register">Сохранить</button>
      <button id="nickname-cancel" class="btn" style="margin-top:8px;background:transparent;color:var(--hint)">Отмена</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
