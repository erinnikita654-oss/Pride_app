<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Покерный клуб</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-logo">
        <img src="logo.png" alt="PRIDE" onerror="this.style.display='none'">
        <h1>Pride</h1>
      </div>
      <nav class="tabs">
        <button class="tab active" data-tab="games">Игры</button>
        <button class="tab" data-tab="rating">Рейтинг</button>
      </nav>
    </header>

    <main>
      <!-- Вкладка: Игры -->
      <section id="tab-games" class="tab-content active">
        <div class="section-title">Предстоящие игры</div>
        <div id="games-list" class="list">
          <div class="loading">Загрузка...</div>
        </div>
        <div class="section-title" style="margin-top:16px">Прошедшие игры</div>
        <div id="past-games-list" class="list">
          <div class="loading">Загрузка...</div>
        </div>
      </section>

      <!-- Экран результатов игры -->
      <section id="screen-results" class="screen hidden">
        <button class="back-btn" id="back-btn">← Назад</button>
        <div id="results-title" class="section-title"></div>
        <div id="results-list" class="list"></div>
      </section>

      <!-- Вкладка: Рейтинг -->
      <section id="tab-rating" class="tab-content">
        <div class="month-selector">
          <button class="month-btn active" data-month="may">Май</button>
          <button class="month-btn" data-month="april">Апрель</button>
        </div>
        <div id="rating-list" class="list">
          <div class="loading">Загрузка рейтинга...</div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
